# Optional complete dashboard using only built-in Home Assistant cards.
# Replace EVERY example_* entity ID with the actual ID from your installation.
# Remove rows for disabled/missing entities. Import into a NEW/EMPTY dashboard.
# This template starts read-only. Installation/update never imports it.
# No resource module or dashboard-tools option is required for this fallback.
title: Smarther
views:
  - title: Climate
    path: climate
    icon: mdi:thermostat
    cards:
      - type: tile
        entity: climate.example_smarther
        name: Smarther
        state_content:
          - current_temperature
          - temperature
          - hvac_action
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon_tap_action:
          action: none
        icon_hold_action:
          action: none
        icon_double_tap_action:
          action: none
      - type: markdown
        title: Telemetry
        content: >-
          {% set climate = 'climate.example_smarther' %}
          {% set last_live = as_timestamp(state_attr(climate, 'last_live_message'), 0) %}
          {% set max_age = state_attr(climate, 'control_max_age_seconds') | float(0) %}
          {% set age = as_timestamp(now()) - last_live %}
          {% if states(climate) in ['unknown', 'unavailable'] or not last_live or max_age <= 0 %}
          Live telemetry: **unknown / unavailable**.
          {% elif age < 0 or age > max_age %}
          Live telemetry: **stale**. Wait for a fresh device update.
          {% else %}
          Live telemetry: **fresh**.
          {% endif %}
          {% if not state_attr(climate, 'controls_enabled') %}
          Thermostat commands: **read-only**.
          {% endif %}
      - type: entities
        title: Smarther status
        show_header_toggle: false
        entities:
          - entity: sensor.example_smarther_humidity
            name: Humidity
          - entity: sensor.example_smarther_heating_state
            name: Heating state
          - entity: sensor.example_smarther_active_program
            name: Active program
          - entity: sensor.example_smarther_boost_end
            name: Boost end
          - entity: sensor.example_smarther_last_mqtt_message
            name: Last MQTT message
      - type: history-graph
        title: Temperature history
        hours_to_show: 24
        entities:
          - climate.example_smarther

